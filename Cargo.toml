[package]
name = "shiguredo_webrtc"
version = "0.156.1-canary.1"
edition = "2024"
rust-version = "1.93"
description = "Rust bindings for libwebrtc"
readme = "README.md"
homepage = "https://github.com/shiguredo/webrtc-rs"
repository = "https://github.com/shiguredo/webrtc-rs"
license = "Apache-2.0"
build = "build.rs"
include = [
  "/src/**",
  "/webrtc/**",
  "Cargo.toml",
  "LICENSE",
  "README.md",
  "build.rs",
  "sysroot/*",
]

[package.metadata.external-dependencies.webrtc-build]
version = "m156.8078.3.5"
base-url = "https://github.com/shiguredo-webrtc-build/webrtc-build/releases/download"

[package.metadata.build-config]
cmake-osx-deployment-target = "16.0"
android-platform = "android-24"
android-commandlinetools-version = "14742923"
android-ndk-version = "27.2.12479018"
# Windows で CMake のビルドに利用する Ninja (自動的にダウンロードする)
ninja-version = "1.13.2"
# ninja-win.zip の SHA256
ninja-win-sha256 = "07fc8261b42b20e71d1720b39068c2e14ffcee6396b76fb7a795fb460b78dc65"

[workspace]
members = ["examples/*"]

[dependencies]

[build-dependencies]
# WebRTC C API のヘッダーから Rust バインディングを生成するために使用
bindgen = "0.72"
# `cargo metadata` の出力 (JSON) から target_directory を取得するために使用
nojson = "0.3"
# WebRTC の C++ ライブラリ (webrtc_c) を CMake でビルドするために使用
shiguredo_cmake = "4.4"
# Cargo.toml の package.metadata を読み取るために使用
shiguredo_toml = "2026.2"

[features]
default = []
debug-build = []
local-export = []
source-build = []
